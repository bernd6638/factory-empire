# Automatische Tests für das Paper-Trading-System im Ordner ai-trading/.
name: AI-Trading-Tests

on:
  push:
    paths: ["ai-trading/**", ".github/workflows/ai-trading-tests.yml"]
  pull_request:
    paths: ["ai-trading/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-trading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
