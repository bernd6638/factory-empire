# Schickt bei jedem neuen Update (Änderung an update.json) automatisch eine Nachricht nach Discord.
name: Discord-Update-Meldung

on:
  push:
    branches: [main]
    paths: [update.json]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nachricht senden
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_ID }}
        run: python tools/discord_notify.py
