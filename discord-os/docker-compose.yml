# Discord OS – Docker Compose
#
#  Nur Datenbanken (lokale Entwicklung / Windows):   docker compose up -d
#  Komplette Anwendung (Server-Hosting):             docker compose --profile app up -d --build
#  Mit lokalem KI-Sprach-Bot (NVIDIA-GPU):           docker compose --profile app --profile voice up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: discordos
      POSTGRES_PASSWORD: discordos
      POSTGRES_DB: discordos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discordos"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://discordos:discordos@postgres:5432/discordos?schema=public
      REDIS_URL: redis://redis:6379
      VOICE_AI_URL: http://voice-ai:8000
      OLLAMA_URL: http://ollama:11434
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Lokaler Sprachdienst: Spracherkennung (Whisper) + Sprachausgabe (Piper) auf der CPU
  voice-ai:
    profiles: ["voice"]
    build: ./voice-ai
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      CPU_THREADS: ${WHISPER_THREADS:-4}
      DEFAULT_VOICE: de_DE-thorsten-medium
    volumes:
      - voicemodels:/models

  # Lokales Sprachmodell (Ollama) auf der NVIDIA-Grafikkarte
  ollama:
    profiles: ["voice"]
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  redisdata:
  voicemodels:
  ollama:
