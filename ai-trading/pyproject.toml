[project]
name = "ai-paper-trading"
version = "1.0.0"
description = "Autonomes KI-Day-Trading-System – ausschließlich Paper-Trading"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "requests>=2.31", "fastapi>=0.110", "uvicorn>=0.27", "cryptography>=42"]

[project.optional-dependencies]
llm = ["anthropic>=2.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
